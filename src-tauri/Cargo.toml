[package]
name = "steamdrop"
version = "0.1.0"
description = "Drop a game folder in, play it from Steam."
license = "MIT"
repository = "https://github.com/Aster8x/SteamDrop"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "8", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
ab_glyph = "0.2"
png = "0.18"
crc32fast = "1"
time = { version = "0.3", features = ["local-offset", "formatting", "macros"] }
keyring = "3"
semver = "1"
dirs = "7"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
