<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <!-- SteamDrop social preview. Important content stays inside the centered 1200x600 safe area. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d2740"/><stop offset="1" stop-color="#0a0d15"/></linearGradient>
    <radialGradient id="glow" cx="0.2" cy="0.48" r="0.42"><stop offset="0" stop-color="#5cc8ff" stop-opacity="0.32"/><stop offset="1" stop-color="#5cc8ff" stop-opacity="0"/></radialGradient>
    <symbol id="drop" viewBox="0 0 64 64"><path d="M32 8 L48.5 33 A18 18 0 1 1 15.5 33 Z" fill="#5cc8ff"/><path d="M28.5 26h7v14h7L32 52 21.5 40h7z" fill="#0d1220"/></symbol>
    <symbol id="tile" viewBox="0 0 100 150"><rect x="2" y="2" width="96" height="146" rx="12" fill="none" stroke="#5cc8ff" stroke-width="3"/></symbol>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <g opacity="0.1">
    <use href="#tile" x="930" y="-60" width="150" height="225"/><use href="#tile" x="1100" y="-20" width="150" height="225"/>
    <use href="#tile" x="1010" y="190" width="150" height="225"/><use href="#tile" x="1180" y="230" width="150" height="225"/>
    <use href="#tile" x="930" y="440" width="150" height="225"/><use href="#tile" x="1100" y="480" width="150" height="225"/>
  </g>
  <use href="#drop" x="66" y="150" width="340" height="340"/>
  <text x="440" y="300" font-family="Chakra Petch" font-weight="700" font-size="132" fill="#eef2f8">SteamDrop</text>
  <rect x="446" y="336" width="120" height="8" rx="4" fill="#5cc8ff"/>
  <text font-family="Atkinson Hyperlegible" font-weight="700" font-size="46" fill="#b9c5da">
    <tspan x="444" y="418">Drop a game folder in.</tspan>
    <tspan x="444" y="476">Play it from Steam.</tspan>
  </text>
  <rect y="628" width="1280" height="12" fill="#5cc8ff"/>
</svg>
