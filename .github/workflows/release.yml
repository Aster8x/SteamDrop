name: Release

# Push a tag like v0.2.0 to publish a release. The tag must match the version in package.json,
# tauri.conf.json and Cargo.toml, and CHANGELOG.md must have a "## [0.2.0]" section (used as the notes).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri downloads NSIS when bundling; keep it between runs so a download hiccup can't break the build.
      - uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ hashFiles('package-lock.json') }}

      - name: Check release setup
        shell: bash
        run: |
          node scripts/version.mjs check "$GITHUB_REF_NAME" || { echo "::error::Version or changelog problem, see above (docs/RELEASING.md)"; exit 1; }
          if grep -q REPLACE_WITH_YOUR_UPDATER_PUBLIC_KEY src-tauri/tauri.conf.json; then
            echo "::error::Put your updater public key in src-tauri/tauri.conf.json (see docs/RELEASING.md)"; exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing (see docs/RELEASING.md)"; exit 1
          fi

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm ci
      - name: Build
        shell: bash
        # One retry: the first build can fail on a temporary download error (seen: HTTP 504 fetching NSIS).
        run: npx tauri build || { sleep 30; npx tauri build; }

      - name: Collect files
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir out
          node scripts/version.mjs notes "$version" > out/notes.md
          cp src-tauri/target/release/bundle/nsis/*-setup.exe out/SteamDrop-Setup.exe
          cp src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/SteamDrop-Setup.exe.sig
          node -e '
            const fs = require("fs");
            const [version, tag, repo] = process.argv.slice(1);
            fs.writeFileSync("out/latest.json", JSON.stringify({
              version,
              notes: fs.readFileSync("out/notes.md", "utf8").trim(),
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": {
                signature: fs.readFileSync("out/SteamDrop-Setup.exe.sig", "utf8").trim(),
                url: `https://github.com/${repo}/releases/download/${tag}/SteamDrop-Setup.exe`,
              } },
            }, null, 2));
          ' "$version" "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/SteamDrop-Setup.exe out/SteamDrop-Setup.exe.sig out/latest.json \
            --title "SteamDrop $GITHUB_REF_NAME" --notes-file out/notes.md
