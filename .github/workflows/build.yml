name: Build

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Tauri downloads NSIS when bundling; keep it between runs so a download hiccup can't break the build.
      - uses: actions/cache@v5
        with:
          path: ~\AppData\Local\tauri
          key: tauri-tools-${{ hashFiles('package-lock.json') }}
      - name: Versions in sync
        run: node scripts/version.mjs check
      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
      - run: npm ci
      - name: Build installer (unsigned, no updater files)
        shell: bash
        # One retry: the first build can fail on a temporary download error (seen: HTTP 504 fetching NSIS).
        run: npx tauri build --config src-tauri/tauri.no-updater.conf.json || { sleep 30; npx tauri build --config src-tauri/tauri.no-updater.conf.json; }
      - uses: actions/upload-artifact@v6
        with:
          name: SteamDrop-Setup-unsigned
          path: src-tauri/target/release/bundle/nsis/*.exe
