<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SteamDrop</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <canvas class="logo" width="32" height="32" aria-hidden="true"></canvas>
      <span>SteamDrop</span>
    </div>
    <nav aria-label="Main">
      <button class="tab" data-view="games" aria-current="page">Games</button>
      <button class="tab" data-view="settings">Settings</button>
      <button class="tab" data-view="about">About</button>
    </nav>
    <div id="tree" aria-hidden="true"></div>
    <button id="theme" class="icon-btn" title="Switch between dark and light" aria-label="Switch between dark and light"></button>
  </header>

  <div class="controlbar" role="toolbar" aria-label="SteamDrop controls">
    <button class="cbtn" id="c-scan" title="Look for new games now (controller: Y)">Scan now</button>
    <button class="cbtn" id="c-view" title="Switch to Couch mode (F11, controller: View)">Couch mode <kbd>F11</kbd></button>
    <button class="cbtn" id="c-hide" title="Hide the window; SteamDrop stays in the tray">Hide</button>
    <button class="cbtn" id="c-close" title="Close the window; SteamDrop keeps watching from the tray">Close</button>
    <button class="cbtn danger" id="c-quit" title="Stop SteamDrop completely">Quit SteamDrop</button>
  </div>
  <div id="status" class="status" role="status" aria-live="polite" hidden></div>

  <main>
    <section id="view-games" class="view"></section>
    <section id="view-settings" class="view" hidden></section>
    <section id="view-about" class="view" hidden></section>
  </main>

  <dialog id="dialog"></dialog>
  <script src="grove.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
