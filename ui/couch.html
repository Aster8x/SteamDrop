<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SteamDrop Couch mode</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="couch.css">
</head>
<body>
  <canvas id="backdrop" aria-hidden="true"></canvas>
  <div id="tree" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <canvas class="logo" width="32" height="32" aria-hidden="true"></canvas>
      <span>SteamDrop</span>
    </div>
    <nav class="tabs" aria-label="Sections">
      <span class="bumper">LB</span>
      <span class="tab" data-tab="library">Library</span>
      <span class="tab" data-tab="settings">Settings</span>
      <span class="tab" data-tab="activity">Activity</span>
      <span class="bumper">RB</span>
    </nav>
  </header>
  <div class="controls" id="controls" role="toolbar" aria-label="SteamDrop controls"></div>
  <main id="screen"></main>
  <footer class="hints" id="hints"></footer>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <script src="grove.js"></script>
  <script src="shared.js"></script>
  <script src="couch.js"></script>
</body>
</html>
